name: ironagent

services:
  mysql:
    build:
      context: .
      dockerfile: docker/Dockerfile.mysql
    image: ironagent-mysql:8.4-fips
    restart: unless-stopped
    ports:
      - "${IRON_AGENT_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${IRON_AGENT_MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${IRON_AGENT_MYSQL_DATABASE:-ironagent}"
      MYSQL_USER: "${IRON_AGENT_MYSQL_USER:-ironagent}"
      MYSQL_PASSWORD: "${IRON_AGENT_MYSQL_PASSWORD:-ironagent}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u${IRON_AGENT_MYSQL_USER:-ironagent} -p${IRON_AGENT_MYSQL_PASSWORD:-ironagent}",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  security-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.security-service
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    restart: unless-stopped
    ports:
      - "${IRON_AGENT_SECURITY_SERVICE_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      IRON_AGENT_STORAGE_BACKEND: "${IRON_AGENT_STORAGE_BACKEND:-mysql}"
      IRON_AGENT_CONFIG_DIR: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/config"
      IRON_AGENT_AUDIT_LOG_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/audit/audit.jsonl"
      IRON_AGENT_AUDIT_ARCHIVE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/audit/archive.jsonl"
      IRON_AGENT_ASSISTANTS_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/assistants/assistants.json"
      IRON_AGENT_APPROVAL_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/approvals/approvals.json"
      IRON_AGENT_APPROVAL_MODE: "${IRON_AGENT_APPROVAL_MODE:-disabled}"
      IRON_AGENT_MODEL_REGISTRY_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/models/registry.json"
      IRON_AGENT_USERS_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/users/users.json"
      IRON_AGENT_USER_BINDINGS_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/users/bindings.json"
      IRON_AGENT_DATABASE_URL: "${IRON_AGENT_DATABASE_URL:-mysql+pymysql://ironagent:ironagent@mysql:3306/ironagent?charset=utf8mb4}"
      IRON_AGENT_ASSISTANTS_WORKSPACE_ROOT: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspaces"
      IRON_AGENT_ALLOWED_WORKSPACE_ROOTS_JSON: "${IRON_AGENT_ALLOWED_WORKSPACE_ROOTS_JSON:-}"
      IRON_AGENT_DEFAULT_WORKSPACE_ROOT_ID: "${IRON_AGENT_DEFAULT_WORKSPACE_ROOT_ID:-default}"
      IRON_AGENT_ASSISTANTS_RUNTIME_ROOT: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/runtimes"
      IRON_AGENT_WORKSPACE_OBJECT_STORAGE_BACKEND: "${IRON_AGENT_WORKSPACE_OBJECT_STORAGE_BACKEND:-local}"
      IRON_AGENT_WORKSPACE_FILE_METADATA_BACKEND: "${IRON_AGENT_WORKSPACE_FILE_METADATA_BACKEND:-}"
      IRON_AGENT_WORKSPACE_FILE_SQLITE_PATH: "${IRON_AGENT_WORKSPACE_FILE_SQLITE_PATH:-${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace.db}"
      IRON_AGENT_WORKSPACE_ITEM_INDEX_SQLITE_PATH: "${IRON_AGENT_WORKSPACE_ITEM_INDEX_SQLITE_PATH:-${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace_item_index.db}"
      IRON_AGENT_WORKSPACE_FILE_SQLITE_BUSY_TIMEOUT_MS: "${IRON_AGENT_WORKSPACE_FILE_SQLITE_BUSY_TIMEOUT_MS:-30000}"
      IRON_AGENT_WORKSPACE_FILE_SQLITE_CACHE_SIZE_MB: "${IRON_AGENT_WORKSPACE_FILE_SQLITE_CACHE_SIZE_MB:-64}"
      IRON_AGENT_WORKSPACE_FILE_SQLITE_WAL_AUTOCHECKPOINT: "${IRON_AGENT_WORKSPACE_FILE_SQLITE_WAL_AUTOCHECKPOINT:-1000}"
      IRON_AGENT_WORKSPACE_FILES_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace_files/files.json"
      IRON_AGENT_WORKSPACE_FILE_EVENTS_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace_files/events.json"
      IRON_AGENT_WORKSPACE_PUSH_REQUESTS_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace_files/push_requests.json"
      IRON_AGENT_WORKSPACE_SYNC_JOB_SQLITE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace_sync_jobs.db"
      IRON_AGENT_WORKSPACE_OBJECT_STORAGE_ROOT: "${IRON_AGENT_WORKSPACE_OBJECT_STORAGE_ROOT:-${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace_objects}"
      IRON_AGENT_WORKSPACE_OBJECT_STORAGE_PREFIX: "${IRON_AGENT_WORKSPACE_OBJECT_STORAGE_PREFIX:-workspace-files}"
      IRON_AGENT_WORKSPACE_RESULT_SCAN_ENABLED: "${IRON_AGENT_WORKSPACE_RESULT_SCAN_ENABLED:-true}"
      IRON_AGENT_WORKSPACE_RESULT_SCAN_INTERVAL_SECONDS: "${IRON_AGENT_WORKSPACE_RESULT_SCAN_INTERVAL_SECONDS:-10}"
      IRON_AGENT_MARKET_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/market/catalog.json"
      IRON_AGENT_MARKET_PACKAGE_ROOT: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/market/packages"
      IRON_AGENT_MARKET_UPLOAD_ROOT: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/market/uploads"
      IRON_AGENT_COLLABORATION_OBJECT_STORAGE_BACKEND: "${IRON_AGENT_COLLABORATION_OBJECT_STORAGE_BACKEND:-cos}"
      IRON_AGENT_COLLABORATION_OBJECT_STORAGE_BUCKET: "${IRON_AGENT_COLLABORATION_OBJECT_STORAGE_BUCKET:-}"
      IRON_AGENT_COLLABORATION_OBJECT_STORAGE_REGION: "${IRON_AGENT_COLLABORATION_OBJECT_STORAGE_REGION:-}"
      IRON_AGENT_COLLABORATION_OBJECT_STORAGE_ENDPOINT: "${IRON_AGENT_COLLABORATION_OBJECT_STORAGE_ENDPOINT:-}"
      IRON_AGENT_COLLABORATION_OBJECT_STORAGE_PREFIX: "${IRON_AGENT_COLLABORATION_OBJECT_STORAGE_PREFIX:-heinu/}"
      IRON_AGENT_COS_SECRET_ID: "${IRON_AGENT_COS_SECRET_ID:-}"
      IRON_AGENT_COS_SECRET_KEY: "${IRON_AGENT_COS_SECRET_KEY:-}"
      IRON_AGENT_COS_SESSION_TOKEN: "${IRON_AGENT_COS_SESSION_TOKEN:-}"
      IRON_AGENT_COS_BUCKET: "${IRON_AGENT_COS_BUCKET:-}"
      IRON_AGENT_COS_REGION: "${IRON_AGENT_COS_REGION:-}"
      IRON_AGENT_COS_ENDPOINT: "${IRON_AGENT_COS_ENDPOINT:-}"
      IRON_AGENT_COS_PREFIX: "${IRON_AGENT_COS_PREFIX:-}"
      IRON_AGENT_OBS_ACCESS_KEY_ID: "${IRON_AGENT_OBS_ACCESS_KEY_ID:-}"
      IRON_AGENT_OBS_SECRET_ACCESS_KEY: "${IRON_AGENT_OBS_SECRET_ACCESS_KEY:-}"
      IRON_AGENT_OBS_BUCKET: "${IRON_AGENT_OBS_BUCKET:-}"
      IRON_AGENT_OBS_ENDPOINT: "${IRON_AGENT_OBS_ENDPOINT:-}"
      IRON_AGENT_OBS_PREFIX: "${IRON_AGENT_OBS_PREFIX:-}"
      IRON_AGENT_INTERNAL_SERVICE_TOKEN: "${IRON_AGENT_INTERNAL_SERVICE_TOKEN:-change-me}"
      IRON_AGENT_CONTROL_UI_PUBLIC_URL: "${IRON_AGENT_CONTROL_UI_PUBLIC_URL:-}"
      IRON_AGENT_GO_GATEWAY_PUBLIC_URL: "${IRON_AGENT_GO_GATEWAY_PUBLIC_URL:-}"
      IRON_AGENT_SECURITY_SERVICE_PUBLIC_URL: "${IRON_AGENT_SECURITY_SERVICE_PUBLIC_URL:-}"
      IRON_AGENT_SECURITY_SERVICE_INTERNAL_URL: "${IRON_AGENT_SECURITY_SERVICE_INTERNAL_URL:-http://security-service:8000}"
      IRON_AGENT_CONTROL_UI_LAUNCH_TICKET_TTL_SECONDS: "${IRON_AGENT_CONTROL_UI_LAUNCH_TICKET_TTL_SECONDS:-90}"
      IRON_AGENT_HOST_IRON_AGENT_ROOT: "${IRON_AGENT_HOST_IRON_AGENT_ROOT:-/tmp/ironagent-host-ironagent}"
      IRON_AGENT_RUNTIME_SOURCE_ROOT: "${IRON_AGENT_RUNTIME_SOURCE_ROOT:?set IRON_AGENT_RUNTIME_SOURCE_ROOT to the absolute ironagent-main path}"
      IRON_AGENT_RUNTIME_SEED_WORKSPACE_SKILLS: "${IRON_AGENT_RUNTIME_SEED_WORKSPACE_SKILLS:-office-docs,local-pdf}"
      IRON_AGENT_DOCKER_SOCKET_PATH: "/var/run/docker.sock"
      IRON_AGENT_RUNTIME_HOOK_SERVICE_URL: "${IRON_AGENT_RUNTIME_HOOK_SERVICE_URL:-http://host.docker.internal:8000}"
      IRON_AGENT_RUNTIME_CONTAINER_EXTRA_HOST: "${IRON_AGENT_RUNTIME_CONTAINER_EXTRA_HOST:-host.docker.internal:host-gateway}"
      IRON_AGENT_RUNTIME_GATEWAY_ACCESS_HOST: "${IRON_AGENT_RUNTIME_GATEWAY_ACCESS_HOST:-}"
      IRON_AGENT_RUNTIME_HTTP_PROXY: "${IRON_AGENT_RUNTIME_HTTP_PROXY:-}"
      IRON_AGENT_RUNTIME_HTTPS_PROXY: "${IRON_AGENT_RUNTIME_HTTPS_PROXY:-}"
    volumes:
      - "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}:${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}"
      - "${IRON_AGENT_HOST_IRON_AGENT_ROOT:-./host-ironagent}:${IRON_AGENT_HOST_IRON_AGENT_ROOT:-/tmp/ironagent-host-ironagent}:ro"
      - "${IRON_AGENT_RUNTIME_SOURCE_ROOT:?set IRON_AGENT_RUNTIME_SOURCE_ROOT to the absolute ironagent-main path}:${IRON_AGENT_RUNTIME_SOURCE_ROOT:?set IRON_AGENT_RUNTIME_SOURCE_ROOT to the absolute ironagent-main path}:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    group_add:
      - "${IRON_AGENT_DOCKER_SOCKET_GID:-1001}"
    depends_on:
      mysql:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    restart: unless-stopped
    ports:
      - "${IRON_AGENT_ADMIN_BIND_HOST:-127.0.0.1}:${IRON_AGENT_ADMIN_PORT:-8501}:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      IRON_AGENT_STORAGE_BACKEND: "${IRON_AGENT_STORAGE_BACKEND:-mysql}"
      IRON_AGENT_CONFIG_DIR: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/config"
      IRON_AGENT_AUDIT_LOG_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/audit/audit.jsonl"
      IRON_AGENT_AUDIT_ARCHIVE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/audit/archive.jsonl"
      IRON_AGENT_ASSISTANTS_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/assistants/assistants.json"
      IRON_AGENT_APPROVAL_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/approvals/approvals.json"
      IRON_AGENT_APPROVAL_MODE: "${IRON_AGENT_APPROVAL_MODE:-disabled}"
      IRON_AGENT_MODEL_REGISTRY_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/models/registry.json"
      IRON_AGENT_USERS_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/users/users.json"
      IRON_AGENT_USER_BINDINGS_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/users/bindings.json"
      IRON_AGENT_DATABASE_URL: "${IRON_AGENT_DATABASE_URL:-mysql+pymysql://ironagent:ironagent@mysql:3306/ironagent?charset=utf8mb4}"
      IRON_AGENT_ASSISTANTS_WORKSPACE_ROOT: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspaces"
      IRON_AGENT_ALLOWED_WORKSPACE_ROOTS_JSON: "${IRON_AGENT_ALLOWED_WORKSPACE_ROOTS_JSON:-}"
      IRON_AGENT_DEFAULT_WORKSPACE_ROOT_ID: "${IRON_AGENT_DEFAULT_WORKSPACE_ROOT_ID:-default}"
      IRON_AGENT_ASSISTANTS_RUNTIME_ROOT: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/runtimes"
      IRON_AGENT_WORKSPACE_OBJECT_STORAGE_BACKEND: "${IRON_AGENT_WORKSPACE_OBJECT_STORAGE_BACKEND:-local}"
      IRON_AGENT_WORKSPACE_FILE_METADATA_BACKEND: "${IRON_AGENT_WORKSPACE_FILE_METADATA_BACKEND:-}"
      IRON_AGENT_WORKSPACE_FILE_SQLITE_PATH: "${IRON_AGENT_WORKSPACE_FILE_SQLITE_PATH:-${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace.db}"
      IRON_AGENT_WORKSPACE_ITEM_INDEX_SQLITE_PATH: "${IRON_AGENT_WORKSPACE_ITEM_INDEX_SQLITE_PATH:-${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace_item_index.db}"
      IRON_AGENT_WORKSPACE_FILE_SQLITE_BUSY_TIMEOUT_MS: "${IRON_AGENT_WORKSPACE_FILE_SQLITE_BUSY_TIMEOUT_MS:-30000}"
      IRON_AGENT_WORKSPACE_FILE_SQLITE_CACHE_SIZE_MB: "${IRON_AGENT_WORKSPACE_FILE_SQLITE_CACHE_SIZE_MB:-64}"
      IRON_AGENT_WORKSPACE_FILE_SQLITE_WAL_AUTOCHECKPOINT: "${IRON_AGENT_WORKSPACE_FILE_SQLITE_WAL_AUTOCHECKPOINT:-1000}"
      IRON_AGENT_WORKSPACE_FILES_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace_files/files.json"
      IRON_AGENT_WORKSPACE_FILE_EVENTS_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace_files/events.json"
      IRON_AGENT_WORKSPACE_PUSH_REQUESTS_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace_files/push_requests.json"
      IRON_AGENT_WORKSPACE_SYNC_JOB_SQLITE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace_sync_jobs.db"
      IRON_AGENT_WORKSPACE_OBJECT_STORAGE_ROOT: "${IRON_AGENT_WORKSPACE_OBJECT_STORAGE_ROOT:-${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/workspace_objects}"
      IRON_AGENT_WORKSPACE_OBJECT_STORAGE_PREFIX: "${IRON_AGENT_WORKSPACE_OBJECT_STORAGE_PREFIX:-workspace-files}"
      IRON_AGENT_WORKSPACE_RESULT_SCAN_ENABLED: "${IRON_AGENT_WORKSPACE_RESULT_SCAN_ENABLED:-true}"
      IRON_AGENT_WORKSPACE_RESULT_SCAN_INTERVAL_SECONDS: "${IRON_AGENT_WORKSPACE_RESULT_SCAN_INTERVAL_SECONDS:-10}"
      IRON_AGENT_MARKET_STORE_PATH: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/market/catalog.json"
      IRON_AGENT_MARKET_PACKAGE_ROOT: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/market/packages"
      IRON_AGENT_MARKET_UPLOAD_ROOT: "${IRON_AGENT_STACK_ROOT:?set IRON_AGENT_STACK_ROOT to an absolute repo path}/data/market/uploads"
      IRON_AGENT_COLLABORATION_OBJECT_STORAGE_BACKEND: "${IRON_AGENT_COLLABORATION_OBJECT_STORAGE_BACKEND:-cos}"
      IRON_AGENT_COLLABORATION_OBJECT_STORAGE_BUCKET: "${IRON_AGENT_COLLABORATION_OBJECT_STORAGE_BUCKET:-}"
      IRON_AGENT_COLLABORATION_OBJECT_STORAGE_REGION: "${IRON_AGENT_COLLABORATION_OBJECT_STORAGE_REGION:-}"
      IRON_AGENT_COLLABORATION_OBJECT_STORAGE_ENDPOINT: "${IRON_AGENT_COLLABORATION_OBJECT_STORAGE_ENDPOINT:-}"
