      IRON_AGENT_CONTROL_UI_PUBLIC_URL: "${IRON_AGENT_CONTROL_UI_PUBLIC_URL:-}"
      IRON_AGENT_GO_GATEWAY_PUBLIC_URL: "${IRON_AGENT_GO_GATEWAY_PUBLIC_URL:-}"
