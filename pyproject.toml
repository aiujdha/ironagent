[project]
name = "ironagent"
version = "0.1.0"
description = "Enterprise security control layer for IronAgent"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "aiomysql>=0.2.0",
  "aiosqlite>=0.21.0",
  "asyncpg>=0.30.0",
  "cos-python-sdk-v5>=1.9.35",
  "cryptography>=45.0.0",
  "esdk-obs-python>=3.24.6.1",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pymysql>=1.1.1",
  "python-multipart>=0.0.31",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.0",
  "pyyaml>=6.0.2",
  "redis>=5.2.0",
  "sqlalchemy[asyncio]>=2.0.38",
  "streamlit>=1.44.0",
  "structlog>=25.1.0",
  "uvicorn[standard]>=0.35.0",
  "xlwings>=0.35.3",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.0",
  "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = []
