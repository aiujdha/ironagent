apiVersion: v1
kind: PersistentVolume
metadata:
  name: ironagent-redis-ha-data-0-local
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ironagent-local
  claimRef:
    namespace: ironagent
    name: redis-data-redis-ha-0
  hostPath:
    path: /app/ironagent/k8s-pv/redis-data-0
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - vm-12-16-ubuntu
---
