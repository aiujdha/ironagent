apiVersion: v1
kind: PersistentVolume
metadata:
  name: assistant-workspaces-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ironagent-local
  volumeMode: Filesystem
  local:
    path: /app/ironagent/assistant-workspaces
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - vm-12-16-ubuntu
