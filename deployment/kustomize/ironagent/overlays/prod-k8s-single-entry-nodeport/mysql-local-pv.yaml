apiVersion: v1
kind: PersistentVolume
metadata:
  name: ironagent-mysql-data-local
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ironagent-local
  hostPath:
    path: /app/ironagent/k8s-pv/mysql-data
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - vm-12-16-ubuntu
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ironagent-local
  volumeName: ironagent-mysql-data-local
  resources:
    requests:
      storage: 20Gi
