apiVersion: v1
kind: ConfigMap
metadata:
  name: go-gateway-config
data:
  GO_GATEWAY_PUBLIC_BASE_URL: http://192.0.2.10:30808
  GO_GATEWAY_PROCESS_ROLE: all
  GO_GATEWAY_PUBLIC_AUTH_DISABLED: "false"
  GO_GATEWAY_DATABASE_MAX_OPEN_CONNS: "120"
  GO_GATEWAY_DATABASE_MAX_IDLE_CONNS: "30"
  GO_GATEWAY_CALLBACK_DATABASE_MAX_OPEN_CONNS: "32"
  GO_GATEWAY_CALLBACK_DATABASE_MAX_IDLE_CONNS: "8"
  GO_GATEWAY_CALLBACK_QUEUE_SIZE: "4096"
  GO_GATEWAY_CALLBACK_ENQUEUE_MAX_IN_FLIGHT: "16"
  GO_GATEWAY_CALLBACK_DELIVERY_CONCURRENCY: "16"
  GO_GATEWAY_CALLBACK_PENDING_LIMIT: "400"
  GO_GATEWAY_CALLBACK_HTTP_TIMEOUT: 30s
  GO_GATEWAY_CALLBACK_LEASE_DURATION: 90s
  GO_GATEWAY_CALLBACK_OUTBOX_WORKER_ENABLED: "true"
  GO_GATEWAY_SECURITY_BASE_URL: http://security-service:8000
  GO_GATEWAY_ADMIN_BASE_URL: http://admin:8501
  GO_GATEWAY_RUNTIME_DISCOVER_ASSISTANTS: "true"
  GO_GATEWAY_RUNTIME_SYNC_INTERVAL: 30s
  GO_GATEWAY_RUNTIME_EXECUTION_ENABLED: "true"
  GO_GATEWAY_RUNTIME_EXECUTION_TIMEOUT: 5m
  GO_GATEWAY_REDIS_MODE: sentinel
  GO_GATEWAY_REDIS_ADDR: ""
  GO_GATEWAY_REDIS_SENTINEL_ADDRS: redis-sentinel:26379
  GO_GATEWAY_REDIS_SENTINEL_MASTER: mymaster
  GO_GATEWAY_REDIS_KEY_PREFIX: go-gateway
  GO_GATEWAY_REDIS_MAX_OPEN_CONNS: "32"
  GO_GATEWAY_REDIS_MAX_IDLE_CONNS: "16"
  GO_GATEWAY_ASSISTANT_CACHE_TTL: 60s
  GO_GATEWAY_ASSISTANT_AVAILABILITY_CACHE_TTL: 30s
  GO_GATEWAY_CHAT_RATE_LIMIT_ENABLED: "true"
  GO_GATEWAY_CHAT_RATE_LIMIT_MAX: "600"
  GO_GATEWAY_CHAT_RATE_LIMIT_WINDOW: 1s
  GO_GATEWAY_CHAT_RATE_LIMIT_FAIL_CLOSED: "true"
  GO_GATEWAY_TASK_WORKER_ENABLED: "true"
  GO_GATEWAY_TASK_WORKER_CONCURRENCY: "16"
  GO_GATEWAY_TASK_WORKER_CLAIM_LIMIT: "1"
  GO_GATEWAY_TASK_WORKER_DRAIN_TIMEOUT: 6m
  GO_GATEWAY_TASK_WORKER_MAX_ATTEMPTS: "1"
  GO_GATEWAY_TASK_WORKER_STALE_PROGRESS_TIMEOUT: 300s
  GO_GATEWAY_TASK_QUEUE_MAX_PENDING: "1000"
  GO_GATEWAY_PROXY_MAX_IN_FLIGHT: "50"
