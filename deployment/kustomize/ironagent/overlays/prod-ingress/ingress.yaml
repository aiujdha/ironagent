apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ironagent-public
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - secretName: ironagent-public-tls
      hosts:
        - control.example.com
        - admin.example.com
        - security.example.com
  rules:
    - host: control.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ironagent-gateway
                port:
                  number: 18789
    - host: admin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 8501
    - host: security.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: security-service
                port:
                  number: 8000
