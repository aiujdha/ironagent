apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ironagent-public
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - secretName: ironagent-public-tls
      hosts:
        - control.example.com
        - gateway.example.com
  rules:
    - host: control.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-gateway
                port:
                  number: 8080
    - host: gateway.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-gateway
                port:
                  number: 8080
