apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-service
spec:
  template:
    spec:
      hostPID: true
      nodeSelector:
        kubernetes.io/hostname: ironagent-worker
      hostAliases:
        - ip: 192.0.2.20
          hostnames:
            - mysql.example.internal
        - ip: 192.0.2.21
          hostnames:
            - cos.example.invalid
      containers:
        - name: security-service
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
