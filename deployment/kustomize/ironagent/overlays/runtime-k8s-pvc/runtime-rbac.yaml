apiVersion: v1
kind: ServiceAccount
metadata:
  name: ironagent-runtime-provisioner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ironagent-runtime-provisioner
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - pods/exec
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ironagent-runtime-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ironagent-runtime-provisioner
subjects:
  - kind: ServiceAccount
    name: ironagent-runtime-provisioner
