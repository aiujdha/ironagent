apiVersion: v1
kind: ConfigMap
metadata:
  name: go-gateway-config
data:
  GO_GATEWAY_CONFIG_FILE: /etc/ironagent/go-gateway.json
  GO_GATEWAY_LISTEN_ADDR: ":8080"
  GO_GATEWAY_MODE: polling
  GO_GATEWAY_PROCESS_ROLE: all
  GO_GATEWAY_SECURITY_BASE_URL: http://security-service:8000
  GO_GATEWAY_ADMIN_BASE_URL: http://admin:8501
  GO_GATEWAY_HMAC_ALLOWED_SKEW: 5m
  GO_GATEWAY_PUBLIC_AUTH_DISABLED: "false"
  GO_GATEWAY_HTTP_TIMEOUT: 60s
  GO_GATEWAY_DATABASE_MAX_OPEN_CONNS: "120"
  GO_GATEWAY_DATABASE_MAX_IDLE_CONNS: "30"
  GO_GATEWAY_DATABASE_CONN_MAX_LIFETIME: 30m
  GO_GATEWAY_DATABASE_CONN_MAX_IDLE_TIME: 5m
  GO_GATEWAY_CALLBACK_DATABASE_MAX_OPEN_CONNS: "32"
  GO_GATEWAY_CALLBACK_DATABASE_MAX_IDLE_CONNS: "8"
  GO_GATEWAY_REDIS_MODE: standalone
  GO_GATEWAY_REDIS_ADDR: ""
  GO_GATEWAY_REDIS_SENTINEL_ADDRS: ""
  GO_GATEWAY_REDIS_SENTINEL_MASTER: ""
  GO_GATEWAY_REDIS_KEY_PREFIX: go-gateway
  GO_GATEWAY_REDIS_TIMEOUT: 500ms
  GO_GATEWAY_REDIS_MAX_OPEN_CONNS: "16"
  GO_GATEWAY_REDIS_MAX_IDLE_CONNS: "8"
  GO_GATEWAY_REDIS_REQUIRED: "false"
  GO_GATEWAY_ASSISTANT_CACHE_TTL: 60s
  GO_GATEWAY_ASSISTANT_AVAILABILITY_CACHE_TTL: 30s
  GO_GATEWAY_CHAT_RATE_LIMIT_ENABLED: "false"
  GO_GATEWAY_CHAT_RATE_LIMIT_MAX: "0"
  GO_GATEWAY_CHAT_RATE_LIMIT_WINDOW: 1s
  GO_GATEWAY_CHAT_RATE_LIMIT_FAIL_CLOSED: "true"
  GO_GATEWAY_PUBLIC_BASE_URL: https://gateway.example.com
  GO_GATEWAY_DEFAULT_CALLBACK_URL: http://ironagent-callback-receiver:8099/taskcallback
  GO_GATEWAY_CALLBACK_CLIENT_ID: ironagent-gateway
  GO_GATEWAY_CALLBACK_ALLOWED_HOSTS: ironagent-callback-receiver:8099,ironagent-callback-receiver
  GO_GATEWAY_CALLBACK_ALLOW_PRIVATE_HOSTS: "true"
  GO_GATEWAY_CALLBACK_FIRE_AND_FORGET: "false"
  GO_GATEWAY_CALLBACK_ACCEPT_ANY_RESPONSE: "false"
  GO_GATEWAY_CALLBACK_REQUIRED: "true"
  GO_GATEWAY_CALLBACK_MAX_ATTEMPTS: "3"
  GO_GATEWAY_CALLBACK_RETRY_DELAY: 250ms
  GO_GATEWAY_CALLBACK_MAX_RETRY_DELAY: 30s
  GO_GATEWAY_CALLBACK_HTTP_TIMEOUT: 30s
  GO_GATEWAY_CALLBACK_QUEUE_SIZE: "4096"
  GO_GATEWAY_CALLBACK_STORE_TIMEOUT: 2s
  GO_GATEWAY_CALLBACK_ENQUEUE_MAX_IN_FLIGHT: "16"
  GO_GATEWAY_CALLBACK_DELIVERY_CONCURRENCY: "16"
  GO_GATEWAY_CALLBACK_WORKER_INTERVAL: 250ms
  GO_GATEWAY_CALLBACK_PENDING_LIMIT: "400"
  GO_GATEWAY_CALLBACK_LEASE_DURATION: 90s
  GO_GATEWAY_CALLBACK_OUTBOX_WORKER_ENABLED: "true"
  GO_GATEWAY_PRESIGN_TTL: 15m
  GO_GATEWAY_PROXY_SESSION_TTL: 30m
  GO_GATEWAY_PROXY_MAX_IN_FLIGHT: "1000"
  GO_GATEWAY_PROXY_FAILURE_THRESHOLD: "3"
  GO_GATEWAY_PROXY_CIRCUIT_OPEN_DURATION: 30s
  GO_GATEWAY_MAX_UPLOAD_BYTES: "52428800"
  GO_GATEWAY_RUNTIME_DEFAULT_CAPACITY: "1"
  GO_GATEWAY_RUNTIME_HEARTBEAT_TTL: 60s
  GO_GATEWAY_RUNTIME_EXECUTION_ENABLED: "true"
  GO_GATEWAY_RUNTIME_EXECUTION_TIMEOUT: 10m
  GO_GATEWAY_TASK_WORKER_ENABLED: "true"
  GO_GATEWAY_TASK_WORKER_ID: go-gateway-task-worker
  GO_GATEWAY_TASK_WORKER_CONCURRENCY: "16"
  GO_GATEWAY_TASK_WORKER_INTERVAL: 250ms
  GO_GATEWAY_TASK_WORKER_CLAIM_LIMIT: "1"
  GO_GATEWAY_TASK_WORKER_LEASE_DURATION: 30s
  GO_GATEWAY_TASK_WORKER_DRAIN_TIMEOUT: 11m
  GO_GATEWAY_TASK_WORKER_MAX_ATTEMPTS: "6"
  GO_GATEWAY_TASK_WORKER_RETRY_DELAY: 75s
  GO_GATEWAY_TASK_WORKER_STALE_PROGRESS_TIMEOUT: 600s
  GO_GATEWAY_TASK_PROGRESS_CALLBACK_ENABLED: "true"
  GO_GATEWAY_TASK_PROGRESS_CALLBACK_BATCH_SIZE: "5"
  GO_GATEWAY_TASK_PROGRESS_CALLBACK_INTERVAL: 90s
  GO_GATEWAY_TASK_PROGRESS_CALLBACK_STEP_MAX_CHARS: "150"
  GO_GATEWAY_TASK_PROGRESS_CALLBACK_STATE_TTL: 2h
  GO_GATEWAY_TASK_QUEUE_MAX_PENDING: "10000"
  GO_GATEWAY_LOG_LEVEL: info
