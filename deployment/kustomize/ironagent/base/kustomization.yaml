apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - go-gateway-file-configmap.yaml
  - go-gateway-configmap.yaml
  - go-gateway-deployment.yaml
  - go-gateway-service.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - cli-deployment.yaml
  - admin-deployment.yaml
  - admin-service.yaml
  - callback-receiver-deployment.yaml
  - callback-receiver-service.yaml
  - security-service-deployment.yaml
  - security-service-service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: workspace-template-files
    files:
      - AGENTS.md=files/templates/AGENTS.md
      - BOOTSTRAP.md=files/templates/BOOTSTRAP.md
      - HEARTBEAT.md=files/templates/HEARTBEAT.md
      - IDENTITY.md=files/templates/IDENTITY.md
      - SOUL.md=files/templates/SOUL.md
      - TOOLS.md=files/templates/TOOLS.md
      - USER.md=files/templates/USER.md
  - name: capability-profile-files
    files:
      - chat.yaml=files/capabilities/chat.yaml
      - dangerous.yaml=files/capabilities/dangerous.yaml
      - onlyread.yaml=files/capabilities/onlyread.yaml
      - onlywrite.yaml=files/capabilities/onlywrite.yaml
      - work_no_exec.yaml=files/capabilities/work_no_exec.yaml
  - name: runtime-command-files
    files:
      - ironagent-docker=files/runtime/ironagent-docker.sh
