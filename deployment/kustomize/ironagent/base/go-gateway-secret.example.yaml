apiVersion: v1
kind: Secret
metadata:
  name: go-gateway-secret
  annotations:
    ironagent.openai.local/example-only: "true"
type: Opaque
stringData:
  GO_GATEWAY_DATABASE_URL: "ironagent:REPLACE_ME@tcp(mysql:3306)/ironagent?parseTime=true&charset=utf8mb4"
  GO_GATEWAY_SCOPED_API_KEYS: '[{"key":"REPLACE_ME","scopes":["public","admin","runtime","debug","proxy"]}]'
  GO_GATEWAY_HMAC_SECRET: "REPLACE_ME"
  GO_GATEWAY_CALLBACK_SECRET: "REPLACE_ME"
  GO_GATEWAY_PRESIGN_SECRET: "REPLACE_ME"
  GO_GATEWAY_PROXY_SESSION_SECRET: "REPLACE_ME"
