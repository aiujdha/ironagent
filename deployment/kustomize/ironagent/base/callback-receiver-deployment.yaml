apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironagent-callback-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ironagent-callback-receiver
  template:
    metadata:
      labels:
        app: ironagent-callback-receiver
    spec:
      containers:
        - name: receiver
          image: localhost/ironagent-callback-receiver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8099
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      enableServiceLinks: false
