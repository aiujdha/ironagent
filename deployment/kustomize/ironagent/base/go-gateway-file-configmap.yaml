apiVersion: v1
kind: ConfigMap
metadata:
  name: go-gateway-file-config
data:
  go-gateway.json: |
    {
      "listen_addr": ":8080",
      "mode": "polling",
      "process_role": "all",
      "security_base_url": "http://security-service:8000",
      "admin_base_url": "http://admin:8501",
      "http_timeout": "10s",
      "database_max_open_conns": 120,
      "database_max_idle_conns": 30,
      "database_conn_max_lifetime": "30m",
      "database_conn_max_idle_time": "5m",
      "callback_database_max_open_conns": 32,
      "callback_database_max_idle_conns": 8,
      "redis_mode": "standalone",
      "redis_addr": "",
      "redis_sentinel_addrs": [],
      "redis_sentinel_master": "",
      "redis_key_prefix": "go-gateway:",
      "redis_timeout": "500ms",
      "redis_max_open_conns": 16,
      "redis_max_idle_conns": 8,
      "redis_required": false,
      "assistant_cache_ttl": "60s",
      "assistant_availability_cache_ttl": "30s",
      "chat_rate_limit_enabled": false,
      "chat_rate_limit_max": 0,
      "chat_rate_limit_window": "1s",
      "chat_rate_limit_fail_closed": true,
      "hmac_allowed_skew": "5m",
      "public_auth_disabled": false,
      "public_base_url": "https://gateway.example.com",
      "default_callback_url": "http://ironagent-callback-receiver:8099/taskcallback",
      "callback_client_id": "ironagent-gateway",
      "callback_allowed_hosts": ["ironagent-callback-receiver:8099", "ironagent-callback-receiver"],
      "callback_allow_private_hosts": true,
      "callback_fire_and_forget": false,
      "callback_accept_any_response": false,
      "callback_required": true,
      "callback_max_attempts": 3,
      "callback_retry_delay": "250ms",
      "callback_max_retry_delay": "30s",
      "callback_http_timeout": "30s",
      "callback_queue_size": 4096,
      "callback_store_timeout": "2s",
      "callback_enqueue_max_in_flight": 16,
      "callback_delivery_concurrency": 16,
      "callback_worker_interval": "250ms",
      "callback_pending_limit": 400,
      "callback_lease_duration": "90s",
      "callback_outbox_worker_enabled": true,
      "presign_ttl": "15m",
      "proxy_session_ttl": "30m",
      "proxy_max_in_flight": 1000,
      "proxy_failure_threshold": 3,
      "proxy_circuit_open_duration": "30s",
      "max_upload_bytes": 52428800,
      "runtime_default_capacity": 1,
      "runtime_heartbeat_ttl": "60s",
      "runtime_execution_timeout": "10m",
      "task_worker_enabled": true,
      "task_worker_id": "go-gateway-task-worker",
      "task_worker_concurrency": 16,
      "task_worker_interval": "250ms",
      "task_worker_claim_limit": 1,
      "task_worker_lease_duration": "30s",
      "task_worker_drain_timeout": "11m",
      "task_worker_max_attempts": 6,
      "task_worker_retry_delay": "75s",
      "task_worker_capacity_wait_max_attempts": 100,
      "task_worker_capacity_wait_timeout": "30m",
      "task_worker_capacity_wait_callback_interval": "5m",
      "task_worker_stale_progress_timeout": "600s",
      "task_progress_callback_enabled": true,
      "task_progress_callback_batch_size": 5,
      "task_progress_callback_interval": "90s",
      "task_progress_callback_step_max_chars": 150,
      "task_progress_callback_state_ttl": "2h",
      "task_queue_max_pending": 10000,
      "task_queue_max_pending_per_assistant": 20,
      "log_level": "info"
    }
