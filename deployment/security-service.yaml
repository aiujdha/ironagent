# Runtime wrapper ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-command-files
  namespace: ironagent
data:
  ironagent-docker: |
    #!/usr/bin/env sh
    set -eu

    NERDCTL_BIN="/usr/local/bin/nerdctl"
    NSENTER_BIN="/usr/bin/nsenter"
    CONTAINERD_NAMESPACE="${CONTAINERD_NAMESPACE:-k8s.io}"
    DOCKER_SOCKET_PATH="${IRONAGENT_DOCKER_SOCKET_PATH:-/run/containerd/containerd.sock}"
    DNS_SERVERS="${IRONAGENT_IRONAGENT_DNS_SERVERS:-}"

    if [ ! -x "$NERDCTL_BIN" ]; then
      echo "missing nerdctl binary at $NERDCTL_BIN" >&2
      exit 127
    fi

    if [ ! -x "$NSENTER_BIN" ]; then
      echo "missing nsenter binary at $NSENTER_BIN" >&2
      exit 127
    fi

    cmd="${1:-}"
    if [ -z "$cmd" ]; then
      echo "missing docker-compatible command" >&2
      exit 64
    fi
    shift

    add_dns_args() {
      if [ -z "$DNS_SERVERS" ]; then
        return
      fi
      old_ifs="$IFS"
      IFS=','
      for server in $DNS_SERVERS; do
        trimmed="$(printf '%s' "$server" | tr -d '[:space:]')"
        if [ -n "$trimmed" ]; then
          printf '%s\0%s\0' "--dns" "$trimmed"
        fi
      done
      IFS="$old_ifs"
    }

    build_args() {
      if [ "$cmd" = "run" ]; then
        printf '%s\0' "$cmd"
        while [ "$#" -gt 0 ]; do
          if [ "$1" = "--init" ]; then
            shift
            continue
          fi
          printf '%s\0' "$1"
          shift
        done
        add_dns_args
        return
      fi

      printf '%s\0' "$cmd"
      while [ "$#" -gt 0 ]; do
        printf '%s\0' "$1"
        shift
      done
    }

    build_args "$@" | xargs -0 "$NSENTER_BIN" -t 1 -m -u -i -n -p -- \
      "$NERDCTL_BIN" --namespace "$CONTAINERD_NAMESPACE" --address "$DOCKER_SOCKET_PATH"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-service
  namespace: ironagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-service
  template:
    metadata:
      labels:
        app: security-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: ironagent-worker
      containers:
        - name: security-service
          image: localhost/ironagent-security-service:main-20260417
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: security-service-config
          volumeMounts:
            - name: runtime-command-files
              mountPath: /app/ironagent/ironagent-feat-hooks/bin/ironagent-docker
              subPath: ironagent-docker
              readOnly: true
            - name: host-ironagent
              mountPath: /app/ironagent
            - name: config-templates
              mountPath: /app/ironagent/docs/reference/templates
            - name: docker-sock
              mountPath: /run/containerd/containerd.sock
            - name: nerdctl-bin
              mountPath: /usr/local/bin/nerdctl
              readOnly: true
            - name: nsenter-bin
              mountPath: /usr/bin/nsenter
              readOnly: true
      volumes:
        - name: runtime-command-files
          configMap:
            name: runtime-command-files
            defaultMode: 493
            items:
              - key: ironagent-docker
                path: ironagent-docker
        - name: host-ironagent
          hostPath:
            path: /app/ironagent # 替换成你实际路径
            type: DirectoryOrCreate
        - name: config-templates
          configMap:
            name: security-service-config
            items:
              - key: AGENTS.md
                path: AGENTS.md
              - key: BOOTSTRAP.md
                path: BOOTSTRAP.md
              - key: HEARTBEAT.md
                path: HEARTBEAT.md
              - key: IDENTITY.md
                path: IDENTITY.md
              - key: SOUL.md
                path: SOUL.md
              - key: TOOLS.md
                path: TOOLS.md
              - key: USER.md
                path: USER.md
        - name: docker-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: nerdctl-bin
          hostPath:
            path: /usr/local/bin/nerdctl
            type: File
        - name: nsenter-bin
          hostPath:
            path: /usr/bin/nsenter
            type: File
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: security-service
  namespace: ironagent
spec:
  type: NodePort
  selector:
    app: security-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
