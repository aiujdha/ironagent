[alembic]
script_location = migrations
# 运行时由 migrations/env.py 用 IRON_AGENT_DATABASE_URL(get_database_url())无条件覆盖,
# 实际迁移走 MySQL。这里仅作离线工具的回退默认值,保持与生产后端(MySQL)一致以免误导。
sqlalchemy.url = mysql+pymysql://ironagent:ironagent@localhost:3306/ironagent?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
