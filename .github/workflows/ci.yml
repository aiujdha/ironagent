name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --dev
      - name: Lint changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse HEAD^)"
            else
              echo "No parent commit exists; skipping baseline lint for the initial snapshot."
              exit 0
            fi
          fi
          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" "$GITHUB_SHA" -- '*.py'
          )
          if ((${#files[@]})); then
            uv run ruff check --output-format=github "${files[@]}"
          else
            echo "No changed Python files to lint."
          fi
      - name: Test
        run: uv run pytest tests -q

  go:
    name: Go Gateway / vet and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go-gateway/go.mod
          cache-dependency-path: go-gateway/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...

  secrets:
    name: Secrets / full history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Go for Gitleaks
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"
          cache: false
      - name: Scan for committed secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.0 git --redact --no-banner .
